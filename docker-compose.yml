services:
  postgres:
    image: postgres:17
    container_name: flagman-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: flagman
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flagman"]
      interval: 5s
      timeout: 5s
      retries: 10

  flagman-api:
    build:
      context: .
      dockerfile: Backend/Dockerfile
    container_name: flagman-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=flagman;Username=postgres;Password=postgres
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
